[env:esp32_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino

extra_scripts =
    pre:scripts/increment-version.py
    post:scripts/copy-bin.py

lib_extra_dirs = 
    ..\..\Libs\External
    ..\..\Libs\Private

upload_speed = 921600

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -Wno-deprecated-declarations
    -Wno-overloaded-virtual
    -Wno-reorder